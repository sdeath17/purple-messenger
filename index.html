<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Purple Messenger</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <main id="authView" class="auth-shell">
    <section class="auth-card glass">
      <div class="brand-mark">✦</div>
      <h1>Purple</h1>
      <p class="muted">Мини-мессенджер без лишнего.</p>

      <div class="tabs">
        <button class="tab active" data-mode="login">Войти</button>
        <button class="tab" data-mode="register">Регистрация</button>
      </div>

      <form id="authForm">
        <label>Ник</label>
        <input id="authUsername" autocomplete="username" maxlength="20" placeholder="например, alex_01" required>
        <label>Пароль</label>
        <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="минимум 6 символов" required>
        <button class="primary-btn" type="submit"><span id="authSubmit">Войти</span><span>→</span></button>
        <div id="authError" class="error"></div>
      </form>
      <p class="tiny">Ник виден другим пользователям. Не используй настоящий пароль от других сервисов.</p>
    </section>
  </main>

  <main id="appView" class="app-shell hidden">
    <aside class="sidebar glass">
      <div class="sidebar-head">
        <div class="brand-small"><span>✦</span> Purple</div>
        <button id="logoutBtn" class="icon-btn" title="Выйти">↪</button>
      </div>

      <div class="profile-chip">
        <div class="avatar" id="myAvatar">P</div>
        <div><b id="myName">@user</b><small>онлайн</small></div>
      </div>

      <div class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" placeholder="Найти по нику...">
      </div>
      <div id="searchResults" class="search-results"></div>

      <div class="sidebar-title">Последние чаты</div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <section class="chat glass">
      <div id="emptyChat" class="empty-chat">
        <div class="empty-icon">✦</div>
        <h2>Начни общение</h2>
        <p>Найди пользователя по нику слева и отправь первое сообщение.</p>
      </div>

      <div id="chatView" class="hidden full-chat">
        <header class="chat-head">
          <button id="backBtn" class="back-btn">‹</button>
          <div class="avatar" id="chatAvatar">U</div>
          <div class="chat-person">
            <b id="chatName">@user</b>
            <small>в сети</small>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="messageForm" class="composer">
          <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
          <button type="button" id="imageBtn" class="round-btn" title="Фото">＋</button>
          <input id="messageInput" autocomplete="off" maxlength="4000" placeholder="Написать сообщение...">
          <button class="send-btn" type="submit">➤</button>
        </form>
        <div class="composer-hint">Фото до 8 МБ · Enter — отправить</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
